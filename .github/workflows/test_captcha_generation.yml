
###############################################################################

name: Test Captcha Generation

###############################################################################

# Trigger the jobs on:
# - A pull request is opened or a new commit is added to the pull request
# - A new release is created or a release is edited
on:
  pull_request:
    branches: [ main, development ]
    types: [opened, synchronize]
  release:
    types: [published, edited]

###############################################################################

# Jobs to run
jobs:

  captcha_generation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Project
        run: |
          make setup

      - name: test_captcha_generation
        run: |
          make test-ci

      - name: Upload generated captchas as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: captchas-build
          path: |
             build/htmlcov/
          #  build/captchas/

###############################################################################
